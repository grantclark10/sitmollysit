# Cloudflare Pages project config. Secrets are NOT set here — see .dev.vars.example
# and `wrangler pages secret put <NAME>` for production.
name = "sit-molly-sit"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://sitmollysit.com"
ADMIN_EMAIL = "hello@sitmollysit.com"
EMAIL_FROM = "Sit Molly Sit! <hello@sitmollysit.com>"

[[d1_databases]]
binding = "DB"
database_name = "sit-molly-sit"
database_id = "TODO-replace-with-output-of-wrangler-d1-create"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sit-molly-sit"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "TODO-replace-with-output-of-wrangler-kv-namespace-create"
